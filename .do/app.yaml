# MIRROR of the live DigitalOcean App Platform spec for app raincloud-site
# (id f5de17d3-15e9-4148-a201-ae3090289c7f), exported 2026-11-01. Secrets/env values stripped.
# Reference only. NEVER apply this file to the live app (doctl apps update --spec / API / dashboard)
# without first diffing it against the live spec: an unchecked copy can wipe the rncld.com
# domains and the 301 redirects. Make ingress/domain changes on the live app, then re-export here.
# The www host rule and the /about.html and retired-stub 301s were added in git after the
# 2026-11-01 export. Pushing main does not apply them. Diff against the live spec, then update.
name: raincloud-site
static_sites:
- name: raincloud-site-raincloud-site
  github:
    repo: colindowling/raincloud-site
    branch: main
    deploy_on_push: true
  environment_slug: html
domains:
- domain: rncld.com
  type: PRIMARY
- domain: www.rncld.com
  type: ALIAS
region: nyc
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
ingress:
  rules:
  # Whole-host 301. No path match, so this does not collide with the catch-all prefix "/".
  # uri is omitted so the request path is kept. scheme https sends the Location to https://rncld.com.
  # This rule is first: the path rules below do not set a host, and a www request that matched
  # one of them would 301 to https://www and then need a second hop.
  - match:
      authority:
        exact: www.rncld.com
    redirect:
      authority: rncld.com
      scheme: https
      redirect_code: 301
  - match:
      path:
        prefix: /vs
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /solutions
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /lp
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /what.html
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /how-it-works.html
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /landscape.html
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /security.html
    redirect:
      uri: /
      redirect_code: 301
  - match:
      path:
        prefix: /roi.html
    redirect:
      uri: /gtm-autopsy/
      redirect_code: 301
  - match:
      path:
        prefix: /blog/the-480-call-problem.html
    redirect:
      uri: /blog/outbound-reply-rates-2026.html
      redirect_code: 301
  - match:
      path:
        prefix: /blog/why-your-battlecards-cost-you-deals.html
    redirect:
      uri: /blog/bofu-content-that-moves-deals.html
      redirect_code: 301
  - match:
      path:
        prefix: /blog/scoreboard-vs-game-film.html
    redirect:
      uri: /blog/why-gtm-builds-fail.html
      redirect_code: 301
  - match:
      path:
        prefix: /audit.html
    redirect:
      uri: /gtm-autopsy/
      redirect_code: 301
  - match:
      path:
        prefix: /about.html
    redirect:
      uri: /about/
      redirect_code: 301
  # The 40-Point Outside Audit is the content of the 20 Minute Teardown.
  # prefix matches both /outside-audit and /outside-audit/.
  - match:
      path:
        prefix: /outside-audit
    redirect:
      uri: /15minutepipelineteardown/
      redirect_code: 301
  - match:
      path:
        prefix: /ai-agents.html
    redirect:
      uri: /
      authority: www.withants.com
      scheme: https
      redirect_code: 301
  - match:
      path:
        prefix: /bofu-content.html
    redirect:
      uri: /
      authority: www.bofubaby.com
      scheme: https
      redirect_code: 301
  - match:
      path:
        prefix: /content.html
    redirect:
      uri: /
      authority: www.friendlyghostwriter.com
      scheme: https
      redirect_code: 301
  - match:
      path:
        prefix: /demand-generation.html
    redirect:
      uri: /gtm-consulting.html
      redirect_code: 301
  - match:
      path:
        prefix: /
      authority:
        exact: ''
    component:
      name: raincloud-site-raincloud-site
features:
- buildpack-stack=ubuntu-22
